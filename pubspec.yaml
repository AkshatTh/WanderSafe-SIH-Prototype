name: wandersafe_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Your other app dependencies
  google_maps_flutter: ^2.5.3
  location: ^5.0.3
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  url_launcher: ^6.2.6
  http: ^1.2.1
  provider: ^6.1.2
  
  # The flutter_localizations package has been REMOVED.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# Flutter specific configuration
flutter:
  # The 'generate: true' flag has been REMOVED.

  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins-Bold.ttf
          weight: 700